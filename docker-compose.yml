services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rgpv_agent_db
    restart: always
    environment:
      POSTGRES_DB: rgpv_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rgpv_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rgpv_agent_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/rgpv_agent
      POSTGRES_SYNC_URL: postgresql://postgres:postgrespassword@postgres:5432/rgpv_agent
      ENV: production
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads

volumes:
  pgdata:
