services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rgpv_agent_db
    restart: always
    environment:
      POSTGRES_DB: rgpv_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rgpv_agent"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rgpv_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rgpv_agent_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/rgpv_agent
      POSTGRES_SYNC_URL: postgresql://postgres:postgrespassword@postgres:5432/rgpv_agent
      ENV: production
      DEBUG: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rgpv_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rgpv_agent_ui
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - rgpv_network

volumes:
  pgdata:

networks:
  rgpv_network:
    driver: bridge
